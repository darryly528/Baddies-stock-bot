services:
  - type: web
    name: baddies-store
    runtime: node
    rootDir: .
    buildCommand: |
      npm install -g pnpm
      cd artifacts/baddies-store && pnpm install --frozen-lockfile && pnpm run build
      cd ../../artifacts/api-server && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node artifacts/api-server/dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: STATIC_DIR
        value: artifacts/baddies-store/dist
      - key: LISTINGS_PATH
        value: /opt/render/project/src/listings.json
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: TICKET_CATEGORY_ID
        sync: false
      - key: TICKET_MOD_ROLE_ID
        sync: false
